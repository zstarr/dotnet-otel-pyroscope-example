# Grafana datasource provisioning
# --------------------------------
# Auto-registers the bundled Prometheus, Loki, and Tempo instances so you can
# query metrics, logs, and traces immediately after `docker compose up`.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true

  - name: Pyroscope
    type: pyroscope
    access: proxy
    url: http://pyroscope:4040
    editable: true
    isDefault: true