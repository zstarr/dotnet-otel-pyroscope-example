# Tempo configuration (single-binary / monolithic mode)
# ------------------------------------------------------
# Receives traces over OTLP from Alloy and stores them on local disk. Grafana
# queries this instance via its HTTP API (:3200) as the "Tempo" datasource.

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 1h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal
